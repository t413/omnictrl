[platformio]

[common]
platform = espressif32
framework = arduino
lib_deps =
  https://github.com/AlfredoSystems/AlfredoCRSF
	https://github.com/CK-Explorer/MadgwickAHRS ;imu filtering
build_src_filter =
    +<*.h>
    +<main_${PIOENV}.cpp>
extra_scripts = pre:utils.py  ;injects version into main
build_unflags = -fno-rtti ;allow dynamic_cast
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; upload_speed = 921600

[m5]
extends = common
lib_deps =
  ${common.lib_deps}
  https://github.com/m5stack/M5Unified
  https://github.com/m5stack/M5GFX
build_flags =
  -DIS_M5

[atoms3]
extends = m5
board = m5stack-atoms3
build_flags =
  ${m5.build_flags}
  -DESP32S3
  -DARDUINO_USB_CDC_ON_BOOT

[atoms3r]
extends = atoms3
board_build.arduino.memory_type = qio_opi
build_flags =
  ${atoms3.build_flags}
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue


### compilable targets: ###

[env:dug]
extends = atoms3

[env:dug_mini]
extends = atoms3

[env:uni]
extends = atoms3

[env:tx_stickc]
extends = m5
board = m5stick-c
lib_deps =
  ${m5.lib_deps}
  ; https://github.com/m5stack/M5Unit-MiniJoyC
  https://github.com/m5stack/M5Unit-Joystick2
lib_ignore = dynamics

[env:tx_stick_s3]
extends = atoms3r
lib_deps =
  ${atoms3r.lib_deps}
  https://github.com/m5stack/M5Unit-Joystick2
build_src_filter = +<main_tx_stickc.cpp> ; use stickc main
lib_ignore = dynamics

[env:test_native]
platform = native
build_type = test
build_flags = -std=gnu++2a
test_framework = googletest
lib_deps =
  googletest
build_src_filter =
  +<main_${PIOENV}.cpp>
test_build_src = yes
